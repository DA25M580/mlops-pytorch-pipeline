apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-checkpoint-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-data-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cifar10-training-job
  namespace: ml-training
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: /app/configs/training_config.yaml
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
            - name: checkpoint-storage
              mountPath: /app/checkpoints
            - name: data-storage
              mountPath: /app/data
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
      volumes:
        - name: config-volume
          configMap:
            name: training-config
        - name: checkpoint-storage
          persistentVolumeClaim:
            claimName: model-checkpoint-pvc
        - name: data-storage
          persistentVolumeClaim:
            claimName: training-data-pvc
